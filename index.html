

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Birthday Cake</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#fff8f2;
      font-family:Arial,sans-serif;
      position:relative;
    }

    /* background dots */

    body::before{
      content:'';
      position:fixed;
      inset:0;
      background-image:
      radial-gradient(rgba(232,88,122,.15) 1px, transparent 1px);
      background-size:22px 22px;
      z-index:0;
    }

    /* balloons */

    .balloons{
      position:fixed;
      inset:0;
      overflow:hidden;
      pointer-events:none;
      z-index:0;
    }

    .balloon{
      position:absolute;
      bottom:-180px;
      animation:rise linear infinite;
      opacity:.9;
    }

    .balloon svg{
      display:block;
    }

    @keyframes rise{

      0%{
        transform:translateY(0) rotate(0deg);
        opacity:0;
      }

      10%{
        opacity:.9;
      }

      100%{
        transform:translateY(-130vh) rotate(15deg);
        opacity:0;
      }
    }

    /* cake section */

    .container{
      position:relative;
      z-index:2;
      text-align:center;
    }

    h1{
      font-size:3rem;
      margin-bottom:1rem;
      background:linear-gradient(135deg,#e8587a,#9b5fcf);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .cake-wrap{
      cursor:pointer;
      transition:.3s;
    }

    .cake-wrap:hover{
      transform:scale(1.05);
    }

    .hint{
      margin-top:1rem;
      color:#8b5e7c;
      font-size:1rem;
    }

    /* confetti */

    .confetti{
      position:fixed;
      width:10px;
      height:14px;
      top:-20px;
      opacity:.95;
      z-index:9999;
      animation:fall linear forwards;
    }

    @keyframes fall{

      to{
        transform:
        translateY(110vh)
        rotate(720deg);

        opacity:0;
      }
    }

  </style>
</head>

<body>

  <!-- balloons -->

  <div class="balloons" id="balloons"></div>

  <!-- cake -->

  <div class="container">

    <h1>Happy Birthday 🎂</h1>

    <div class="cake-wrap" id="cakeWrap">

      <svg width="260" height="220" viewBox="0 0 200 170" fill="none">

        <!-- candles -->

        <rect x="74" y="44" width="9" height="20" rx="3" fill="#fde68a"/>
        <rect x="95" y="40" width="9" height="24" rx="3" fill="#c7d2fe"/>
        <rect x="116" y="44" width="9" height="20" rx="3" fill="#fca5a5"/>

        <!-- flames -->

        <ellipse class="flame" cx="78.5" cy="41" rx="5" ry="7" fill="#fb923c"/>
        <ellipse class="flame" cx="99.5" cy="37" rx="5" ry="7" fill="#fb923c"/>
        <ellipse class="flame" cx="120.5" cy="41" rx="5" ry="7" fill="#fb923c"/>

        <!-- top layer -->

        <rect x="65" y="62" width="70" height="26" rx="6" fill="#f9a8d4"/>
        <rect x="65" y="82" width="70" height="8" fill="#fbcfe8"/>

        <!-- middle layer -->

        <rect x="45" y="88" width="110" height="30" rx="6" fill="#c4b5fd"/>
        <rect x="45" y="110" width="110" height="10" fill="#ddd6fe"/>

        <!-- base layer -->

        <rect x="25" y="118" width="150" height="38" rx="8" fill="#e8587a"/>

        <!-- frosting -->

        <ellipse cx="55" cy="118" rx="9" ry="6" fill="#fff" opacity=".7"/>
        <ellipse cx="80" cy="118" rx="9" ry="6" fill="#fff" opacity=".6"/>
        <ellipse cx="105" cy="118" rx="9" ry="6" fill="#fff" opacity=".7"/>
        <ellipse cx="130" cy="118" rx="9" ry="6" fill="#fff" opacity=".6"/>
        <ellipse cx="155" cy="118" rx="9" ry="6" fill="#fff" opacity=".7"/>

        <!-- plate -->

        <ellipse cx="100" cy="156" rx="85" ry="9" fill="#f0b429" opacity=".35"/>

      </svg>

    </div>

    <p class="hint">
      Click the cake for endless confetti 🎉
    </p>

  </div>

  <script>
    <script>

  // balloon colors

  const colors = [
    '#e8587a',
    '#9b5fcf',
    '#f0b429',
    '#6ee7b7',
    '#93c5fd',
    '#fca5a5'
  ];

  // balloons

  const balloonWrap =
    document.getElementById('balloons');

  function createBalloon(i){

    const balloon =
      document.createElement('div');

    balloon.className = 'balloon';

    balloon.style.left =
      Math.random()*100 + 'vw';

    balloon.style.animationDuration =
      (10 + Math.random()*8) + 's';

    balloon.style.animationDelay =
      Math.random()*5 + 's';

    const size =
      40 + Math.random()*25;

    const color =
      colors[i % colors.length];

    balloon.innerHTML = `
      <svg width="${size}" height="${size*1.3}" viewBox="0 0 60 80">

        <ellipse
          cx="30"
          cy="30"
          rx="20"
          ry="26"
          fill="${color}"
        />

        <line
          x1="30"
          y1="55"
          x2="30"
          y2="80"
          stroke="#999"
          stroke-width="2"
        />

      </svg>
    `;

    balloonWrap.appendChild(balloon);
  }

  for(let i=0;i<15;i++){
    createBalloon(i);
  }

  // cake click

  const cake =
    document.getElementById('cakeWrap');

  cake.addEventListener('click', function(e){

    launchConfetti(e.clientX, e.clientY);

  });

  // confetti function

  function launchConfetti(x,y){

    for(let i=0;i<120;i++){

      const conf =
        document.createElement('div');

      conf.className = 'confetti';

      // START FROM CLICK POSITION

      conf.style.left = x + 'px';
      conf.style.top = y + 'px';

      conf.style.position = 'fixed';

      conf.style.width =
        (6 + Math.random()*8) + 'px';

      conf.style.height =
        (8 + Math.random()*12) + 'px';

      conf.style.background =
        colors[
          Math.floor(Math.random()*colors.length)
        ];

      conf.style.borderRadius =
        Math.random() > 0.5 ? '50%' : '2px';

      // RANDOM SPREAD

      const spreadX =
        (Math.random() - 0.5) * 800;

      const spreadY =
        (Math.random() - 0.5) * 800;

      conf.animate(

        [
          {
            transform:
              `translate(0,0) rotate(0deg)`,
            opacity:1
          },

          {
            transform:
              `translate(${spreadX}px, ${spreadY}px)
               rotate(${Math.random()*720}deg)`,

            opacity:0
          }

        ],

        {
          duration:2000 + Math.random()*1500,
          easing:'cubic-bezier(.15,.89,.32,1.28)',
          fill:'forwards'
        }

      );

      document.body.appendChild(conf);

      setTimeout(()=>{
        conf.remove();
      },4000);

    }

  }

</script>

  </script>

</body>
</html>
